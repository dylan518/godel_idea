<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EvoScientist — Hosted</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>EvoScientist hosted</h1>
      </header>

      <form id="jobForm" class="panel" autocomplete="off">
        <div class="field">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" name="prompt" required minlength="1" placeholder="What should the agent do?"></textarea>
        </div>
        <div class="actions">
          <button type="submit" id="submitBtn">Run job</button>
          <button type="button" class="secondary hidden" id="restartBtn">Restart server</button>
        </div>
      </form>

      <div id="jobPanel" class="panel hidden">
        <h2>Run</h2>
        <div class="run-header">
          <span id="statusPill" class="status-pill queued">—</span>
          <span id="elapsed" class="elapsed hidden"></span>
        </div>
        <ol class="progress-track" id="progressTrack" aria-label="Job progress">
          <li class="progress-step" data-step="queued">Queued</li>
          <li class="progress-step" data-step="running">Running</li>
          <li class="progress-step" data-step="done">Done</li>
        </ol>
        <p id="jobMeta" class="job-meta"></p>
        <div id="activityLog" class="activity-log hidden" aria-live="polite"></div>
        <p id="runExplainer" class="hint subtle"></p>
        <div id="resultBox" class="hidden"></div>
        <div id="errorBox" class="hidden"></div>
      </div>

      <footer id="footerHint"></footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
