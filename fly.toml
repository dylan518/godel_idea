# EvoScientist hosted API + Arq worker (same Docker image, two process groups).
# Prerequisites: Redis app (fly.redis.toml) + Fly Postgres attached to this app.
# Rename `app` if the name is taken: `fly apps create your-name` then match here.

app = "evoscientist-hosted"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.hosted"

[env]
  PORT = "8080"
  EVOSCIENTIST_HOSTED_DISABLE_MCP = "1"

[processes]
  web = "hosted-api"
  worker = "hosted-worker"

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[[vm]]
  cpus = 1
  cpu_kind = "shared"
  memory = "1gb"
  processes = ["web"]

[[vm]]
  cpus = 1
  cpu_kind = "shared"
  memory = "4gb"
  processes = ["worker"]
